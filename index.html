function applyTheme(k){if(TA!='admin')S.theme=k;if(TA!='store')S.at=k;TH={};save();draw()}
const rnd=()=>{const k=Object.keys(THEMES);applyTheme(k[Math.floor(Math.random()*k.length)])};
function THEMEP(){const at=S.at||S.theme;return`<h2>Themes</h2><p class="mut">Pick a look for your store and admin panel. It changes instantly.</p><div class="row" style="margin:14px 0"><span class="mut">Apply to</span><span class="sg2">${[['both','Store and admin'],['store','Store only'],['admin','Admin only']].map(([v,l])=>`<button class="${TA==v?'on':''}" onclick="TA='${v}';draw()">${l}</button>`).join('')}</span><span class="sp"></span><button class="btn" onclick="rnd()">Surprise me</button></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${Object.entries(THEMES).map(([k,t])=>`<div class="card h" style="cursor:pointer;background:${t.s1};color:${t.tx};border-color:${S.theme==k||at==k?t.ac:t.ln}" onclick="applyTheme('${k}')"><div style="background:${t.bg};border-radius:10px;padding:14px;margin-bottom:12px"><div style="height:10px;width:50%;border-radius:6px;background:${t.tx};opacity:.85"></div><div style="height:8px;width:72%;border-radius:6px;background:${t.mut};opacity:.6;margin:8px 0 12px"></div><div style="display:flex;gap:8px;align-items:center"><span style="background:linear-gradient(135deg,${t.ac},${t.ac2});color:${t.on};padding:4px 12px;border-radius:8px;font-size:12px;font-weight:600">Buy now</span><i style="width:16px;height:16px;border-radius:50%;background:${t.ac2}"></i><i style="width:16px;height:16px;border-radius:50%;background:${t.ac}"></i></div></div><b>${t.n}</b><div style="font-size:13px;opacity:.7">${t.d}</div><div style="margin-top:8px;font-size:12px;color:${t.ac}">${S.theme==k?'● Store ':''}${at==k?'● Admin':''}</div></div>`).join('')}</div>`}
(()=>{const st=document.createElement('style');st.textContent=Object.entries(THEMES).map(([k,t])=>`[data-theme=${k}]{--bg:${t.bg};--s1:${t.s1};--s2:${t.s2};--tx:${t.tx};--mut:${t.mut};--ac:${t.ac};--ac2:${t.ac2};--on:${t.on};--ln:${t.ln}}`).join('');document.head.appendChild(st)})();
draw();boot();
</script></body></html>
